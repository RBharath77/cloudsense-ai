services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cloudsense
      POSTGRES_USER: cloudsense
      POSTGRES_PASSWORD: cloudsense_dev
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U cloudsense -d cloudsense"],interval: 5s,timeout: 5s,retries: 10}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD","redis-cli","ping"],interval: 5s,timeout: 3s,retries: 10}
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://cloudsense:cloudsense_dev@postgres:5432/cloudsense
      JWT_SECRET: change-this-in-production
      CLOUD_MODE: mock
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
  frontend:
    build: ./frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports: ["3000:3000"]
    depends_on: [backend]
volumes: {pgdata: {}}
