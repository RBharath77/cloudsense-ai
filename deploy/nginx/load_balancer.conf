# ==============================================================================
# CloudSense AI - Enterprise High-Concurrency HTTPS Load Balancer Configuration
# Architecture: Dual TLS Termination, Least-Connection Clustering, Zero-Leakage
# ==============================================================================

# Worker Processes tuned for multi-core high-throughput concurrency
worker_processes auto;
worker_rlimit_nofile 65535;

events {
    worker_connections 8192;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --------------------------------------------------------------------------
    # Server Fingerprint Masking & Data Leakage Prevention
    # --------------------------------------------------------------------------
    server_tokens off;
    more_clear_headers 'Server' 'X-Powered-By' 'X-Runtime' 'X-Version';

    # --------------------------------------------------------------------------
    # Logging Formats (PII Masking & Timing Diagnostics)
    # --------------------------------------------------------------------------
    log_format cloudsense_combined '$remote_addr - $remote_user [$time_local] '
                                  '"$request_method $uri $server_protocol" $status $body_bytes_sent '
                                  '"$http_referer" "$http_user_agent" '
                                  'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log cloudsense_combined buffer=32k flush=5s;
    error_log /var/log/nginx/error.log warn;

    # --------------------------------------------------------------------------
    # TCP Concurrency & Buffer Optimizations
    # --------------------------------------------------------------------------
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    keepalive_requests 10000;
    reset_timedout_connection on;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 15s;

    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;

    # --------------------------------------------------------------------------
    # Gzip Compression for High-Speed Page Delivery
    # --------------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/json
        application/javascript
        application/x-javascript
        application/xml
        application/xml+rss
        image/svg+xml;

    # --------------------------------------------------------------------------
    # High-Concurrency Rate Limiting Zones (DDoS Guard with High Burst Allowance)
    # Allows many legitimate users to log in simultaneously without rejection
    # --------------------------------------------------------------------------
    limit_req_zone $binary_remote_addr zone=login_ratelimit:10m rate=40r/s;
    limit_req_zone $binary_remote_addr zone=general_api_ratelimit:20m rate=100r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # --------------------------------------------------------------------------
    # Upstream Backend Cluster (Least-Connection Load Balancing with Keepalive)
    # --------------------------------------------------------------------------
    upstream cloudsense_backend_cluster {
        least_conn; # Distribute new requests to worker with fewest active connections
        server backend_1:8000 max_fails=3 fail_timeout=10s;
        server backend_2:8000 max_fails=3 fail_timeout=10s;
        server backend_3:8000 max_fails=3 fail_timeout=10s;
        keepalive 64; # High persistent keepalive pool to eliminate connection handshake latency
    }

    # --------------------------------------------------------------------------
    # Upstream Frontend Cluster (Next.js Multi-Instance Web App)
    # --------------------------------------------------------------------------
    upstream cloudsense_frontend_cluster {
        least_conn;
        server frontend_1:3000 max_fails=3 fail_timeout=10s;
        server frontend_2:3000 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # ==========================================================================
    # HTTP Port 80 -> Strict Automatic HTTPS 301 Redirection
    # ==========================================================================
    server {
        listen 80;
        listen [::]:80;
        server_name localhost _;

        # ACME Challenge endpoint for Let's Encrypt automated TLS renewal
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        # Force all plaintext traffic to encrypted HTTPS
        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ==========================================================================
    # HTTPS Port 443 -> Enterprise TLS Termination & Defense-in-Depth
    # ==========================================================================
    server {
        listen 443 ssl http2;
        listen [::]:443 ssl http2;
        server_name localhost _;

        # ----------------------------------------------------------------------
        # Modern TLS Encryption Certificates & Ciphers (OWASP Standard)
        # ----------------------------------------------------------------------
        ssl_certificate /etc/nginx/ssl/cloudsense.crt;
        ssl_certificate_key /etc/nginx/ssl/cloudsense.key;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers on;
        ssl_session_cache shared:SSL:50m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # ----------------------------------------------------------------------
        # Zero-Leakage & Security Headers
        # ----------------------------------------------------------------------
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self' http: https:;" always;

        # ----------------------------------------------------------------------
        # Backend API Health Probes (Sub-millisecond latency check)
        # ----------------------------------------------------------------------
        location ~ ^/(api/health|healthz)$ {
            proxy_pass http://cloudsense_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            access_log off;
        }

        # ----------------------------------------------------------------------
        # High-Concurrency Authentication & Login Endpoint
        # Rate-limited with large burst queue so hundreds can authenticate simultaneously
        # ----------------------------------------------------------------------
        location /api/auth/login {
            limit_req zone=login_ratelimit burst=80 nodelay;
            limit_conn conn_limit 50;

            proxy_pass http://cloudsense_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;
            proxy_connect_timeout 5s;
            proxy_read_timeout 30s;
            proxy_send_timeout 30s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        }

        # ----------------------------------------------------------------------
        # General Backend API Cluster Routing
        # ----------------------------------------------------------------------
        location /api/ {
            limit_req zone=general_api_ratelimit burst=120 nodelay;

            proxy_pass http://cloudsense_backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
            proxy_next_upstream error timeout invalid_header http_500 http_502 http_503;
        }

        # ----------------------------------------------------------------------
        # Frontend Web Application Routing (Next.js Multi-Instance)
        # ----------------------------------------------------------------------
        location / {
            proxy_pass http://cloudsense_frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            proxy_connect_timeout 5s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # ----------------------------------------------------------------------
        # Static Assets Caching & Performance
        # ----------------------------------------------------------------------
        location /_next/static/ {
            proxy_pass http://cloudsense_frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            expires 365d;
            add_header Cache-Control "public, max-age=31536000, immutable";
            access_log off;
        }
    }
}
